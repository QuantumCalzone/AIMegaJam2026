# T89: each push to noHumansOnSet that changes the game packages it on our own machines
# (self-hosted runners) and pushes it to the itch.io page with butler: the PC pushes the
# channel "windows", the Mac the channel "mac". See "Deploys to itch.io" in CLAUDE.md.
#
# It never runs on pull_request: a fork's pull request could run code on our machines.
# A commit with [skip ci] in its message starts no run.

name: itch.io builds

on:
  push:
    branches: [noHumansOnSet]
    paths:
      - "Content/**"
      - "Config/**"
      - "AIMegaJam2026.uproject"
      - ".github/workflows/itch-deploy.yml"
      - "Tools/deploy_itch.py"
  workflow_dispatch:

# Many sessions push. A newer push cancels the run in progress, so a burst builds only its newest
# commit. Tools/deploy_itch.py stops what a cancelled run leaves in the deploy worktree.
concurrency:
  group: itch-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, nhos-build]
    timeout-minutes: 120
    env:
      NHOS_REPO: C:/Users/Personal/Projects/AIMegaJam2026
      NHOS_DEPLOY: C:/Users/Personal/Projects/NHOS_deploy
      UE_ROOT: E:/Epic Games/UE_5.8
    steps:
      # Only the scripts and data files are needed here, so no LFS: the build itself is made in
      # the deploy worktree, which shares the repo folder's LFS store.
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Check the data files
        shell: cmd
        run: python Tools/check_prompts.py --offline

      - name: Package, check for secrets and push to itch.io
        shell: cmd
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python -u Tools/deploy_itch.py --commit "${{ github.sha }}"

  # Off until the Mac is a runner: set the repository variable MAC_DEPLOY to true, and
  # MAC_NHOS_REPO and MAC_NHOS_DEPLOY to the Mac's repo folder and deploy worktree
  # (Settings > Secrets and variables > Actions > Variables). Without it, no Mac job waits.
  mac:
    if: ${{ vars.MAC_DEPLOY == 'true' }}
    runs-on: [self-hosted, macOS, nhos-build]
    timeout-minutes: 150
    env:
      NHOS_REPO: ${{ vars.MAC_NHOS_REPO }}
      NHOS_DEPLOY: ${{ vars.MAC_NHOS_DEPLOY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Check the data files
        run: python3 Tools/check_prompts.py --offline

      - name: Package, check for secrets and push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python3 -u Tools/deploy_itch.py --commit "${{ github.sha }}"
