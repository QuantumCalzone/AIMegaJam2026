# T89: each push to noHumansOnSet that changes the game packages a Windows build on the PC's
# self-hosted runner and pushes it to the itch.io page as the post-jam file (channel
# windows-postjam). The jam's file is never touched. See "Deploys to itch.io" in CLAUDE.md.
#
# It never runs on pull_request: a fork's pull request could run code on the PC.
# A commit with [skip ci] in its message starts no run.

name: itch.io post-jam Windows build

on:
  push:
    branches: [noHumansOnSet]
    paths:
      - "Content/**"
      - "Config/**"
      - "AIMegaJam2026.uproject"
      - ".github/workflows/itch-windows.yml"
      - "Tools/deploy_itch.py"
  workflow_dispatch:

# Many sessions push. A newer push cancels the run in progress, so a burst builds only its newest
# commit. Tools/deploy_itch.py stops what a cancelled run leaves in the deploy worktree.
concurrency:
  group: itch-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, nhos-build]
    timeout-minutes: 120
    env:
      NHOS_REPO: C:/Users/Personal/Projects/AIMegaJam2026
      NHOS_DEPLOY: C:/Users/Personal/Projects/NHOS_deploy
      UE_ROOT: E:/Epic Games/UE_5.8
    steps:
      # Only the scripts and data files are needed here, so no LFS: the build itself is made in
      # the deploy worktree, which shares the repo folder's LFS store.
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Check the data files
        shell: cmd
        run: python Tools/check_prompts.py --offline

      - name: Package, check for secrets and push to itch.io
        shell: cmd
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python -u Tools/deploy_itch.py --commit "${{ github.sha }}"
