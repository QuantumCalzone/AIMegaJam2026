[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True

[/Script/UnrealEd.EditorLoadingSavingSettings]
; Auto Reimport offers to import new source files under Content/ as assets.
; Content/NHOS/Data holds JSON the game reads at runtime, so skip that folder.
; The engine's entry for /Game/ already skips Localization/*. Replace that entry
; rather than add a second one, or the first entry would still watch NHOS/Data.
; A copy of this setting in Saved/Config overrides this file.
!AutoReimportDirectorySettings=ClearArray
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*"),(Wildcard="NHOS/Data/*")))
